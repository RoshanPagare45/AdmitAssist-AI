<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - R.H. Sapat College</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #4a90e2;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .header h1 span {
            color: #c8e0ff;
            font-size: 14px;
            display: block;
            margin-top: 5px;
        }

        .logout-btn {
            background: transparent;
            color: white;
            padding: 12px 30px;
            border: 2px solid #4a90e2;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #4a90e2;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #1e3c72;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .stat-card .number {
            color: #2a5298;
            font-size: 54px;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 25px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #1e3c72;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 2;
            min-width: 300px;
            padding: 14px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
        }

        .search-btn {
            padding: 14px 25px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        select {
            padding: 14px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e6ed;
            color: #2c3e50;
        }

        tr:hover {
            background: #f8fafc;
        }

        .view-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .view-btn:hover {
            background: #1e3c72;
        }

        .no-data, .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 16px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #c8e0ff;
            margin-top: 40px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 1000px;
            border-radius: 16px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px 16px 0 0;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .chat-table {
            width: 100%;
            border-collapse: collapse;
        }

        .chat-table th {
            background: #f4f6f9;
            color: #1e3c72;
            padding: 10px;
        }

        .chat-table td {
            padding: 10px;
            border-bottom: 1px solid #e0e6ed;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Administration Dashboard
        <span>R.H. Sapat College, Nashik</span>
    </h1>
    <button class="logout-btn" onclick="logout()">← Logout</button>
</div>

<div class="dashboard-container">
    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Enquiries</h3>
            <div class="number" id="totalCount">-</div>
        </div>
        <div class="stat-card">
            <h3>MCA Enquiries</h3>
            <div class="number" id="mcaCount">-</div>
        </div>
        <div class="stat-card">
            <h3>M.E. Enquiries</h3>
            <div class="number" id="meCount">-</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('enquiries')">All Enquiries</button>
        <button class="tab-btn" onclick="showTab('mostasked')">Most Asked Queries</button>
        <button class="tab-btn" onclick="showTab('search')">Search User</button>
    </div>

    <!-- Tab 1: Enquiries -->
    <div id="tabEnquiries" class="tab-content active">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name or email..." onkeyup="filterEnquiries()">
                <select id="courseFilter" onchange="filterEnquiries()">
                    <option value="all">All Courses</option>
                    <option value="MCA">MCA</option>
                    <option value="M.E.">M.E.</option>
                </select>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="enquiriesTable">
                    <tr><td colspan="5" class="loading">Loading enquiries...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tab 2: Most Asked Queries -->
    <div id="tabMostAsked" class="tab-content">
        <div class="table-container">
            <div id="mostAskedList" class="loading">Loading...</div>
        </div>
    </div>

    <!-- Tab 3: Search User -->
    <div id="tabSearch" class="tab-content">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="userSearch" class="search-input" placeholder="Search by name, email, or mobile...">
                <button class="search-btn" onclick="searchUsers()">Search User</button>
            </div>
        </div>
        <div id="searchResults"></div>
    </div>
</div>

<div class="footer">
    <p>© 2026 R.H. Sapat College | PG Admission Assistance System</p>
</div>

<!-- Modal -->
<div id="chatModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Chat History</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">Loading...</div>
    </div>
</div>

<script>
let allEnquiries = [];

function showTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    if(tabName === 'enquiries') {
        document.getElementById('tabEnquiries').classList.add('active');
        document.querySelector('.tabs button:first-child').classList.add('active');
    } else if(tabName === 'mostasked') {
        document.getElementById('tabMostAsked').classList.add('active');
        document.querySelector('.tabs button:nth-child(2)').classList.add('active');
        loadMostAsked();
    } else if(tabName === 'search') {
        document.getElementById('tabSearch').classList.add('active');
        document.querySelector('.tabs button:nth-child(3)').classList.add('active');
    }
}

// Load Enquiries
function loadEnquiries() {
    fetch('/enquiries')
        .then(res => res.json())
        .then(data => {
            allEnquiries = data;
            updateStats(data);
            displayEnquiries(data);
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('enquiriesTable').innerHTML = '<tr><td colspan="5" class="no-data">Failed to load enquiries</td></tr>';
        });
}

function updateStats(data) {
    document.getElementById('totalCount').innerText = data.length;
    document.getElementById('mcaCount').innerText = data.filter(e => e.course === 'MCA').length;
    document.getElementById('meCount').innerText = data.filter(e => e.course === 'M.E.').length;
}

function displayEnquiries(data) {
    let tbody = document.getElementById('enquiriesTable');
    tbody.innerHTML = '';
    
    if(data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="no-data">No enquiries found</td></tr>';
        return;
    }
    
    data.forEach(e => {
        tbody.innerHTML += `
            <tr>
                <td>${e.id}</td>
                <td>${e.fullName || 'N/A'}</td>
                <td>${e.email || 'N/A'}</td>
                <td>${e.course || 'N/A'}</td>
                <td>${e.message ? e.message.substring(0, 60) : 'N/A'}${e.message && e.message.length > 60 ? '...' : ''}</td>
            </tr>
        `;
    });
}

function filterEnquiries() {
    let search = document.getElementById('searchInput').value.toLowerCase();
    let course = document.getElementById('courseFilter').value;
    
    let filtered = allEnquiries.filter(e => {
        if(course !== 'all' && e.course !== course) return false;
        if(search && !e.fullName?.toLowerCase().includes(search) && !e.email?.toLowerCase().includes(search)) return false;
        return true;
    });
    
    displayEnquiries(filtered);
}

function loadMostAsked() {
    fetch('/admin/most-asked')
        .then(res => res.json())
        .then(data => {
            console.log("Raw data:", data);
            
            // Define mapping for similar questions
            const questionMapping = {
                'mca fee': 'mca fees',
                'mca fees': 'mca fees',
                'mca placement': 'placement',
                'mca placements': 'placement',
                'me fee': 'me fees',
                'me fees': 'me fees',
                'me placement': 'placement',
                'me placements': 'placement',
                'fee structure': 'fee structure',
                'admission dates': 'admission dates',
                'cut-off tracker': 'cut-off tracker',
                'course recommendation': 'course recommendation'
            };
            
            const questionMap = new Map();
            
            data.forEach(item => {
                let question = item[0].toLowerCase().trim();
                let count = item[1];
                
                // Map to standard question if exists
                let mappedQuestion = questionMapping[question] || question;
                
                if (questionMap.has(mappedQuestion)) {
                    questionMap.set(mappedQuestion, questionMap.get(mappedQuestion) + count);
                } else {
                    questionMap.set(mappedQuestion, count);
                }
            });
            
            let combinedData = Array.from(questionMap.entries())
                .map(([q, c]) => ({ question: q, count: c }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);
            
            let html = `
                <div style="margin-bottom: 16px; padding: 12px 16px; background: #f8f9fc; border-radius: 8px; border-left: 3px solid #4a90e2;">
                    <span style="font-size: 13px; color: #4a627a;">Top ${combinedData.length} Most Asked Questions</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
            `;
            
            combinedData.forEach((item, i) => {
                let question = item.question.charAt(0).toUpperCase() + item.question.slice(1);
                html += `
                    <div style="background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                            <span style="background: #f7fafc; color: #4a627a; font-size: 12px; font-weight: 600; width: 28px; text-align: center;">${i+1}</span>
                            <span style="font-size: 14px; color: #2d3748;">${question}</span>
                        </div>
                        <span style="background: #f7fafc; color: #4a90e2; font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 20px;">${item.count} times</span>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('mostAskedList').innerHTML = html;
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('mostAskedList').innerHTML = '<div class="no-data">Failed to load</div>';
        });
}

// Search Users
function searchUsers() {
    let searchTerm = document.getElementById('userSearch').value.trim();
    if(!searchTerm) {
        showNotification("Please enter a name, email, or mobile number to search");
        return;
    }
    
    console.log("Searching for:", searchTerm);
    document.getElementById('searchResults').innerHTML = '<div class="loading">🔍 Searching for users...</div>';
    
    fetch(`/api/user/search?search=${encodeURIComponent(searchTerm)}`)
        .then(res => {
            console.log("Response status:", res.status);
            if (!res.ok) {
                throw new Error('Network response was not ok');
            }
            return res.json();
        })
        .then(data => {
            console.log("Search results:", data);
            let html = '<div class="table-container">\n<table>\n<thead>\n<tr>\n<th>ID</th>\n<th>Name</th>\n<th>Email</th>\n<th>Mobile</th>\n<th>Action</th>\n</tr>\n</thead>\n<tbody>';
            
            if(!data || data.length === 0) {
                html += `<tr><td colspan="5" class="no-data">❌ No users found matching "${searchTerm}"</td></tr>`;
            } else {
                data.forEach(user => {
                    html += `
                        <tr>
                            <td>${user.id}</td>
                            <td><strong>${user.fullName}</strong></td>
                            <td>${user.email}</td>
                            <td>${user.mobile}</td>
                            <td><button class="view-btn" onclick="viewChats(${user.id}, '${user.fullName.replace(/'/g, "\\'")}')">View Chats</button></td>
                        </tr>
                    `;
                });
            }
            html += '</tbody>\n</table>\n</div>';
            document.getElementById('searchResults').innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('searchResults').innerHTML = '<div class="no-data">⚠️ Error searching users. Please try again.</div>';
        });
}

function showNotification(message) {
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #1e3c72;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        z-index: 1000;
        animation: fadeInOut 2s ease;
    `;
    notification.textContent = message;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 2000);
}

// View User Chats
function viewChats(userId, userName) {
    console.log("Viewing chats for user ID:", userId);
    
    document.getElementById('modalTitle').innerHTML = `Chat History: ${userName}`;
    document.getElementById('chatModal').style.display = 'flex';
    document.getElementById('modalBody').innerHTML = '<div class="loading">Loading chats...</div>';
    
    fetch(`/api/user/${userId}/chats`)
        .then(res => res.json())
        .then(data => {
            if(!data || data.length === 0) {
                document.getElementById('modalBody').innerHTML = '<div class="no-data">No chat history found for this user</div>';
                return;
            }
            
            let html = `
                <div style="margin-bottom: 20px; padding: 12px 16px; background: #f8f9fc; border-radius: 8px; border-left: 3px solid #4a90e2;">
                    <span style="font-size: 13px; color: #4a627a;">Total Messages: ${data.length}</span>
                </div>
            `;
            
            html += `<div style="display: flex; flex-direction: column; gap: 16px;">`;
            
            data.forEach((chat, index) => {
                let date = chat.createdAt ? new Date(chat.createdAt).toLocaleString() : 'N/A';
                let userMsg = chat.userMessage || 'N/A';
                let botRes = chat.botResponse || 'N/A';
                
                html += `
                    <div style="background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <div style="padding: 10px 16px; background: #f7fafc; border-bottom: 1px solid #e2e8f0;">
                            <span style="font-size: 12px; color: #718096;">${date}</span>
                        </div>
                        <div style="padding: 16px;">
                            <div style="margin-bottom: 16px;">
                                <div style="font-size: 12px; font-weight: 600; color: #2d3748; margin-bottom: 6px;">User:</div>
                                <div style="background: #f7fafc; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #1a202c; line-height: 1.5; word-wrap: break-word;">
                                    ${escapeHtml(userMsg)}
                                </div>
                            </div>
                            <div>
                                <div style="font-size: 12px; font-weight: 600; color: #2d3748; margin-bottom: 6px;">Assistant:</div>
                                <div style="background: #f7fafc; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #1a202c; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;">
                                    ${escapeHtml(botRes)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            document.getElementById('modalBody').innerHTML = html;
        })
        .catch(err => {
            console.error("Error:", err);
            document.getElementById('modalBody').innerHTML = '<div class="no-data">Error loading chats</div>';
        });
}

function escapeHtml(text) {
    if (!text) return 'N/A';
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/\n/g, '<br>');
}

function closeModal() {
    document.getElementById('chatModal').style.display = 'none';
}

function logout() {
    window.location.href = '/';
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    loadEnquiries();
});
</script>
</body>
</html>
