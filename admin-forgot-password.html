<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - R.H. Sapat College</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* FIXED SCREEN */
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e0e7ff;
    }

    /* CENTER CONTAINER */
    .forgot-container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* CARD - Dark Glass */
    .forgot-box {
        width: 100%;
        max-width: 430px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(18px);
        border-radius: 24px;
        padding: 35px 30px;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 8px 30px rgba(0,0,0,0.45);
        position: relative;
    }

    /* Subtle border glow */
    .forgot-box::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6, #3b82f6);
        border-radius: 26px;
        z-index: -1;
        opacity: 0.15;
        animation: borderGlow 4s ease infinite;
        background-size: 200% 200%;
    }

    @keyframes borderGlow {
        0% { opacity: 0.1; }
        50% { opacity: 0.25; }
        100% { opacity: 0.1; }
    }

    /* HEADER TEXT */
    .logo {
        text-align: center;
        margin-bottom: 25px;
    }

    .logo h1 {
        color: white;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
    }

    .logo .subtitle {
        color: #94a3b8;
        font-size: 13px;
        letter-spacing: 1px;
        font-weight: 500;
        margin-top: 8px;
    }

    .logo hr {
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        margin: 12px auto;
        border: none;
        border-radius: 2px;
    }

    /* ALERT */
    .alert {
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 13px;
        backdrop-filter: blur(4px);
    }

    .alert-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
    }

    /* STEP */
    .step-indicator {
        text-align: center;
        margin-bottom: 20px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
    }

    /* FORM */
    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #94a3b8;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        font-size: 13px;
        background: rgba(255,255,255,0.03);
        color: white;
        transition: all 0.25s ease;
    }

    .form-group input::placeholder,
    .form-group select {
        color: rgba(255,255,255,0.45);
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: rgba(59,130,246,0.5);
        background: rgba(255,255,255,0.06);
        box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
    }

    .form-group select option {
        background: #1e293b;
        color: white;
    }

    /* BUTTON */
    .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        margin-top: 12px;
    }

    .submit-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(59,130,246,0.3);
    }

    .submit-btn:active {
        transform: scale(0.98);
    }

    /* PASSWORD MATCH */
    .password-hint {
        font-size: 11px;
        margin-top: 6px;
        min-height: 18px;
        color: #94a3b8;
    }

    /* LINKS */
    .back-link {
        text-align: center;
        margin-top: 20px;
    }

    .back-link a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 12px;
        transition: color 0.2s;
    }

    .back-link a:hover {
        color: #60a5fa;
    }

    /* FOOTER */
    .footer {
        text-align: center;
        margin-top: 20px;
        color: #64748b;
        font-size: 10px;
    }

    /* MOBILE */
    @media (max-width: 480px) {
        .forgot-box {
            padding: 25px 20px;
        }
        .logo h1 {
            font-size: 12px;
        }
    }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-box">
            <div class="logo">
                <h1>Gokhale Education Society's
R. H. Sapat College of Engineering, Management Studies And Research</h1>
                <div class="subtitle">Reset Password</div>
                <hr>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div th:if="${step == null or step == 1}">
                <div class="step-indicator">Step 1 of 2: Verify Identity</div>
                
                <form action="/auth/verify-identity" method="post">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="Enter your registered email" required>
                    </div>

                    <div class="form-group">
                        <label>Security Question</label>
                        <select name="securityQuestion" required>
                            <option value="">Select your security question</option>
                            <option value="pet">What was your first pet's name?</option>
                            <option value="school">What was the name of your first school?</option>
                            <option value="mother">What is your mother's maiden name?</option>
                            <option value="city">In which city were you born?</option>
                            <option value="book">What is your favorite book?</option>
                            <option value="movie">What is your favorite movie?</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Security Answer</label>
                        <input type="text" name="securityAnswer" placeholder="Your answer" required>
                    </div>

                    <button type="submit" class="submit-btn">Verify Identity</button>
                </form>
            </div>

            <div th:if="${step == 2}">
                <div class="step-indicator">Step 2 of 2: Set New Password</div>
                
                <form action="/auth/reset-password" method="post" onsubmit="return validatePassword()">
                    <input type="hidden" name="email" th:value="${email}">

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" name="newPassword" id="newPassword" placeholder="Min 6 characters" required>
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Re-enter new password" required>
                    </div>

                    <div class="password-hint" id="passwordMatchMsg"></div>

                    <button type="submit" class="submit-btn">Reset Password</button>
                </form>
            </div>

            <div class="back-link">
                <a href="/auth/signin">← Back to Sign In</a>
            </div>

            <div class="footer">
                <p>© 2026 R.H. Sapat College | Password Recovery</p>
            </div>
        </div>
    </div>

    <script>
        function validatePassword() {
            let password = document.getElementById('newPassword').value;
            let confirm = document.getElementById('confirmPassword').value;

            if (password.length < 6) {
                alert('Password must be at least 6 characters long!');
                return false;
            }

            if (password !== confirm) {
                alert('Passwords do not match!');
                return false;
            }

            return true;
        }

        if (document.getElementById('confirmPassword')) {
            document.getElementById('confirmPassword').addEventListener('input', function() {
                let password = document.getElementById('newPassword').value;
                let confirm = this.value;
                let msg = document.getElementById('passwordMatchMsg');
                
                if (confirm.length > 0) {
                    if (password === confirm) {
                        msg.innerHTML = '✓ Passwords match';
                        msg.style.color = '#4ade80';
                    } else {
                        msg.innerHTML = '✗ Passwords do not match';
                        msg.style.color = '#f87171';
                    }
                } else {
                    msg.innerHTML = '';
                }
            });
        }
    </script>
</body>
</html>
