<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - R.H. Sapat College</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a2a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(74,144,226,0.08) 0%, transparent 60%);
            animation: rotate 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(74,144,226,0.3);
            position: relative;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #4a90e2, #1e3c72, #4a90e2);
            border-radius: 18px;
            z-index: -1;
            opacity: 0.3;
            animation: borderGlow 4s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes borderGlow {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #1e3c72;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .logo .blue {
            color: #4a90e2;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .logo hr {
            width: 60px;
            height: 3px;
            background: linear-gradient(135deg, #1e3c72 0%, #4a90e2 100%);
            margin: 15px auto;
            border: none;
            border-radius: 3px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            background: #ffffff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74,144,226,0.1);
            background: white;
        }

        .form-group input::placeholder {
            color: #94a3b8;
            font-style: italic;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30,60,114,0.3);
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-style: italic;
            text-align: center;
            padding: 8px;
            background: rgba(220,53,69,0.1);
            border-radius: 8px;
            border-left: 3px solid #dc3545;
        }

        .auth-links {
            margin-top: 25px;
            text-align: center;
            border-top: 1px solid #e0e6ed;
            padding-top: 20px;
        }

        .auth-links p {
            margin: 8px 0;
        }

        .auth-links a {
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            padding: 5px 10px;
            display: inline-block;
        }

        .auth-links a:hover {
            color: #4a90e2;
            transform: translateX(5px);
        }

        .auth-links .primary-link {
            color: #1e3c72;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #4a90e2;
            border-radius: 25px;
            padding: 8px 20px;
            margin: 5px 0;
        }

        .auth-links .primary-link:hover {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            transform: translateY(-2px);
            border-color: transparent;
        }

        .auth-links .secondary-link {
            color: #4a627a;
            font-size: 13px;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #4a627a;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
            padding: 5px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 25px;
            display: inline-block;
        }

        .back-link a:hover {
            background: #1e3c72;
            color: white;
            border-color: #1e3c72;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }

        .footer span {
            color: #4a90e2;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a90e2;
            font-size: 16px;
            font-style: normal;
        }

        .input-icon input {
            padding-left: 35px;
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid transparent;
            border-top-color: white;
            border-right-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0 10px;
            color: #4a627a;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e6ed;
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>R.H. Sapat College</h1>
                <div class="blue">Administration Portal</div>
                <hr>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); login()">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <i>👤</i>
                        <input type="text" id="username" placeholder="Enter admin username" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i>🔐</i>
                        <input type="password" id="password" placeholder="Enter admin password">
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">Login to Dashboard</button>

                <div class="error-message" id="loginError">
                    <span>⚠️</span> Invalid username or password
                </div>
            </form>

            <!-- New Authentication System Links -->
            <div class="divider">New Teacher Portal</div>
            
            <div class="auth-links">
                <p>
                    <!-- FIXED: This now points to the correct registration page URL -->
                    <a href="/auth/signup" class="primary-link">📝 Create New Teacher Account</a>
                </p>
                <p>
                    <a href="/auth/admin-signin" class="primary-link">🔐 Teacher Login →</a>
                </p>
                <p>
                    <a href="/auth/admin-forgot-password" class="secondary-link">❓ Forgot Password?</a>
                </p>
            </div>

            <div class="back-link">
                <a href="/">← Back to Main Portal</a>
            </div>

            <div class="footer">
                <p>© 2026 R.H. Sapat College<br>
                <span>PG Admission Assistance System</span></p>
            </div>
        </div>
    </div>

    <script>
        function login() {
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let errorElement = document.getElementById('loginError');
            let loginBtn = document.getElementById('loginBtn');

            if (username.trim() === '' || password.trim() === '') {
                errorElement.style.display = 'block';
                errorElement.innerHTML = '<span>⚠️</span> Please enter both username and password';
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.textContent = '';

            setTimeout(() => {
                if (username === 'admin' && password === 'admin123') {
                    errorElement.style.display = 'none';
                    window.location.href = '/dashboard';
                } else {
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = 'Login to Dashboard';
                    errorElement.style.display = 'block';
                    errorElement.innerHTML = '<span>⚠️</span> Invalid username or password';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            }, 800);
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('loginError').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('loginError').style.display = 'none';
        });

        document.getElementById('username').focus();

        document.getElementById('loginForm').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
